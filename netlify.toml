# ============================================================
# Netlify — HR Management Frontend
# ============================================================
[build]
  command = "npm run build"
  publish = "dist"

# SPA redirects: lahat ng route ay napupunta sa index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
